[package]
name = "medocupa-erp"
version = "1.0.1"
description = "MedOcupa ERP - Sistema ERP Especializado en Salud Ocupacional"
authors = ["MedOcupa ERP Team"]
edition = "2021"

[lib]
name = "medocupa_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
tauri-plugin-opener = "^2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true
